<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halal Compass Pro</title>

    <!-- PWA Settings (เปิดเต็มจอแบบแอปแท้) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#022c22">
    <link rel="manifest" href='data:application/manifest+json,{"name": "Halal Compass Pro", "short_name": "HalalCompass", "start_url": ".", "display": "standalone", "background_color": "#022c22", "theme_color": "#059669"}'>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gradient-to-br from-emerald-950 via-teal-950 to-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-4">

    <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-xl rounded-3xl p-5 border border-emerald-500/30 shadow-2xl relative overflow-hidden">
        
        <!-- Header & Language Selector -->
        <div class="flex justify-between items-center mb-4 relative z-10">
            <div>
                <p class="text-[10px] text-amber-400 font-bold uppercase tracking-wider">Islamic Utility App</p>
                <h1 class="text-xl font-bold text-white flex items-center gap-2">
                    Halal Compass <span class="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/30 px-2 py-0.5 rounded-full">Pro</span>
                </h1>
            </div>
            <div class="flex gap-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700">
                <button onclick="setLanguage('th')" id="lang-th" class="px-2 py-1 text-[10px] font-bold rounded-lg bg-emerald-500 text-slate-950 transition">TH</button>
                <button onclick="setLanguage('en')" id="lang-en" class="px-2 py-1 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white transition">EN</button>
                <button onclick="setLanguage('ms')" id="lang-ms" class="px-2 py-1 text-[10px] font-bold rounded-lg text-slate-400 hover:text-white transition">MS</button>
            </div>
        </div>

        <!-- Prayer Times Section -->
        <div class="bg-slate-900/80 border border-emerald-500/30 p-3.5 rounded-2xl mb-4 shadow-lg relative z-10">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1">
                    🕌 <span data-i18n="prayer_title">เวลาละหมาดวันนี้</span>
                </span>
                <button onclick="updateLocation()" class="text-[10px] bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 px-2 py-1 rounded-full flex items-center gap-1">
                    📍 <span data-i18n="gps_btn">รีเฟรช GPS</span>
                </button>
            </div>
            <div class="grid grid-cols-5 gap-1.5 text-center text-xs">
                <div class="p-1.5 bg-slate-800/80 rounded-xl border border-slate-700/60"><p class="text-slate-400 text-[10px]" data-i18n="fajr">ซุบฮิ</p><p id="fajrTime" class="font-bold text-emerald-300 text-xs">--:--</p></div>
                <div class="p-1.5 bg-slate-800/80 rounded-xl border border-slate-700/60"><p class="text-slate-400 text-[10px]" data-i18n="dhuhr">ซุฮฺริ</p><p id="dhuhrTime" class="font-bold text-emerald-300 text-xs">--:--</p></div>
                <div class="p-1.5 bg-emerald-600/30 rounded-xl border border-emerald-500/50"><p class="text-emerald-300 text-[10px] font-semibold" data-i18n="asr">อัศริ</p><p id="asrTime" class="font-extrabold text-white text-xs">--:--</p></div>
                <div class="p-1.5 bg-slate-800/80 rounded-xl border border-slate-700/60"><p class="text-slate-400 text-[10px]" data-i18n="maghrib">มักริบ</p><p id="maghribTime" class="font-bold text-emerald-300 text-xs">--:--</p></div>
                <div class="p-1.5 bg-slate-800/80 rounded-xl border border-slate-700/60"><p class="text-slate-400 text-[10px]" data-i18n="isha">อิชาอ์</p><p id="ishaTime" class="font-bold text-emerald-300 text-xs">--:--</p></div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex gap-1.5 mb-3 relative z-10 overflow-x-auto pb-1">
            <button onclick="switchTab('qibla')" id="tabQibla" class="py-2 px-3 rounded-xl text-xs font-bold bg-emerald-500 text-slate-950 transition whitespace-nowrap shadow-md">🧭 <span data-i18n="tab_qibla">ทิศกิบลัต</span></button>
            <button onclick="switchTab('food')" id="tabFood" class="py-2 px-3 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 transition whitespace-nowrap">🍲 <span data-i18n="tab_food">ร้านฮาลาล</span></button>
            <button onclick="switchTab('mosque')" id="tabMosque" class="py-2 px-3 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 transition whitespace-nowrap">🕌 <span data-i18n="tab_mosque">มัสยิด</span></button>
            <button onclick="switchTab('tasbih')" id="tabTasbih" class="py-2 px-3 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 transition whitespace-nowrap">📿 <span data-i18n="tab_tasbih">ซิเกร</span></button>
        </div>

        <!-- Qibla Compass Container -->
        <div id="qiblaContainer" class="bg-slate-800/80 border border-slate-700 p-5 rounded-2xl text-center relative z-10 mb-3">
            <p class="text-xs text-amber-300 font-semibold mb-1" data-i18n="qibla_heading">🕋 ทิศกิบลัต (ทิศสู่นครมักกะฮ์)</p>
            <p class="text-[11px] text-slate-400 mb-3"><span data-i18n="qibla_deg">องศากิบลัตจากตำแหน่งคุณ:</span> <span class="text-emerald-400 font-bold" id="qiblaDegreeVal">--°</span></p>
            <div class="relative w-36 h-36 mx-auto my-2 flex items-center justify-center bg-slate-950 rounded-full border-4 border-emerald-500/40 shadow-inner">
                <div id="compassNeedle" class="w-full h-full absolute top-0 left-0 flex items-center justify-center transition-transform duration-300">
                    <div class="w-2 h-16 bg-gradient-to-t from-transparent via-emerald-400 to-amber-400 rounded-full shadow-lg"></div>
                </div>
            </div>
            <p class="text-[10px] text-slate-500 mt-2" data-i18n="compass_hint">*หมุนโทรศัพท์เพื่อปรับทิศทางตามวงเข็มทิศ</p>
        </div>

        <!-- Places List Container -->
        <div id="placeContainer" class="hidden relative z-10 mb-3">
            <div id="placeList" class="space-y-2 max-h-48 overflow-y-auto pr-1"></div>
            <a id="mapsSearchBtn" href="#" target="_blank" class="w-full bg-slate-800 hover:bg-slate-700 border border-emerald-500/30 text-emerald-300 text-xs font-semibold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 mt-2">
                🗺️ <span data-i18n="google_maps_btn">ค้นหาเพิ่มเติมบน Google Maps</span>
            </a>
        </div>

        <!-- Digital Tasbih Container -->
        <div id="tasbihContainer" class="hidden bg-slate-800/80 border border-slate-700 p-4 rounded-2xl text-center relative z-10 mb-3">
            <p class="text-xs text-amber-300 font-semibold mb-1">SubhanAllah (ซุบฮานัลลอฮ์)</p>
            <div id="tasbihCount" class="text-5xl font-extrabold text-white my-3 tracking-wider">0</div>
            <div class="flex gap-2 justify-center">
                <button onclick="countTasbih()" class="flex-1 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition shadow-lg active:scale-95" data-i18n="count_btn">👆 กดนับ</button>
                <button onclick="resetTasbih()" class="bg-slate-700 hover:bg-slate-600 text-slate-
