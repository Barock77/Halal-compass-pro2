<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halal Compass Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; min-height: 100vh; background-color: #0f172a; color: #f8fafc; }
        body { padding: 15px; display: flex; justify-content: center; align-items: flex-start; }
        
        .app-box { width: 100%; max-width: 400px; background-color: #1e293b; border-radius: 20px; padding: 18px; border: 1px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,0.6); display: block !important; }
        
        /* Quran Verse Box */
        .quran-box { background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%); border: 1px solid #3b82f6; padding: 12px; border-radius: 14px; text-align: center; margin-bottom: 15px; }
        .quran-arabic { font-size: 16px; color: #fbbf24; font-weight: bold; margin-bottom: 6px; line-height: 1.4; }
        .quran-translate { font-size: 11px; color: #bae6fd; font-style: italic; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .title-sub { font-size: 11px; color: #38bdf8; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        .title-main { font-size: 20px; font-weight: bold; color: #ffffff; }
        .live-clock { font-size: 12px; color: #fbbf24; font-weight: bold; margin-top: 3px; }
        .lang-group { display: flex; gap: 4px; background: #0f172a; padding: 3px; border-radius: 10px; }
        .lang-btn { background: transparent; border: none; color: #94a3b8; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: #3b82f6; color: #fff; }

        /* GPS Banner Alert */
        .gps-alert { background: #0f172a; border: 1px dashed #3b82f6; padding: 10px; border-radius: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .gps-alert-text { font-size: 11px; color: #bae6fd; }
        .btn-gps-alert { background: #3b82f6; color: #fff; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer; white-space: nowrap; }

        /* Card */
        .card { background-color: #334155; border-radius: 14px; padding: 14px; margin-bottom: 15px; border: 1px solid #475569; }
        
        /* Prayer Times */
        .prayer-row { display: flex; gap: 4px; justify-content: space-between; margin-bottom: 12px; }
        .prayer-item { background-color: #1e293b; padding: 8px 2px; border-radius: 8px; flex: 1; text-align: center; font-size: 11px; color: #94a3b8; }
        .prayer-item strong { display: block; color: #38bdf8; font-size: 12px; margin-top: 2px; }
        .prayer-item.active { background-color: #3b82f6; color: #fff; }
        .prayer-item.active strong { color: #fff; }

        /* Prayer Notification Settings */
        .notif-settings { border-top: 1px solid #475569; padding-top: 10px; }
        .notif-title { font-size: 12px; color: #fbbf24; margin-bottom: 6px; font-weight: bold; }
        .notif-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; font-size: 11px; }
        .notif-item { display: flex; align-items: center; gap: 4px; background: #1e293b; padding: 4px 6px; border-radius: 6px; cursor: pointer; color: #cbd5e1; }
